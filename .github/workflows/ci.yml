name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 四端构建（macOS aarch64/x86_64、Windows、Linux、Android），产物存 artifact
  build:
    uses: ./.github/workflows/build.yml
